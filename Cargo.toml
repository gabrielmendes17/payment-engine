[package]
name = "payment-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "payment_engine"
path = "src/lib.rs"

[[bin]]
name = "payment-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
csv = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
rust_decimal_macros = "1"
